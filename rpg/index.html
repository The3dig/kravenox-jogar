<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07050a">
<title>Kravenox — Reino Quebrado</title>
<link rel="apple-touch-icon" href="../index.apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07050a; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Pixelify Sans", monospace; color: #e8dcc8; }
  #screen { display: block; image-rendering: pixelated; background: #000; box-shadow: 0 0 0 2px #2a1a22, 0 0 40px #3a0a12; }
  #pad { display: none; width: 100%; box-sizing: border-box; padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
    justify-content: space-between; align-items: center; }
  body.touch #pad { display: flex; }
  #dpad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(#1c1420, #120c16);
    box-shadow: inset 0 0 0 2px #3a2630; touch-action: none; }
  #dpad .arm { position: absolute; background: #2c2030; border-radius: 6px; box-shadow: inset 0 0 0 1px #4a3440; }
  #dpad .h { left: 22px; top: 55px; width: 106px; height: 40px; }
  #dpad .v { left: 55px; top: 22px; width: 40px; height: 106px; }
  #dpad .knob { position: absolute; left: 63px; top: 63px; width: 24px; height: 24px; border-radius: 50%; background: #3a2834; }
  #dpad.dir-up .v, #dpad.dir-down .v, #dpad.dir-left .h, #dpad.dir-right .h { background: #4a2a36; }
  .btns { display: flex; gap: 16px; align-items: flex-end; }
  .btn { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 600; touch-action: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 4px 0 #000; }
  #btnA { background: #7a1624; color: #ffd9a8; margin-bottom: 34px; }
  #btnB { background: #2c2236; color: #c8b8e0; }
  .btn.on { filter: brightness(1.5); transform: translateY(2px); }
  body.touch.landscape { flex-direction: row; }
  body.touch.landscape #pad { position: fixed; inset: 0; pointer-events: none; padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); }
  body.touch.landscape #pad > * { pointer-events: auto; opacity: .75; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 13px; color: #6d5a66; }
  body.touch #hint { display: none; }
</style>
</head>
<body>
<canvas id="screen" width="960" height="720"></canvas>
<div id="pad">
  <div id="dpad"><div class="arm h"></div><div class="arm v"></div><div class="knob"></div></div>
  <div class="btns"><div class="btn" id="btnB">B</div><div class="btn" id="btnA">A</div></div>
</div>
<div id="hint">Setas/WASD: andar · Z/Enter: confirmar (A) · X/Esc: voltar e menu (B)</div>
<script>
// Carrega sempre a versão mais nova: pergunta ao servidor qual é a versão atual (sem cache)
// e baixa os arquivos com esse número, para o navegador não reaproveitar os antigos.
(function () {
  const files = ["js/engine.js", "js/audio.js", "js/gfx.js", "js/enemies.js", "js/data.js", "js/mapdata.js", "js/maps.js", "js/world.js", "js/field.js", "js/dungeon.js", "js/dungeon3d.js", "js/battle.js", "js/menus.js", "js/cinema.js", "js/story.js", "js/main.js"];
  function go(v) {
    window.KRAVENOX_V = v;
    let i = 0;
    (function next() { if (i >= files.length) return; const sc = document.createElement('script'); sc.src = files[i++] + '?v=' + v; sc.onload = next; document.body.appendChild(sc); })();
  }
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(j => go(j.v)).catch(() => go(String(Date.now())));
})();
</script>
</body>
</html>
