<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1d52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Reino Quebrado">
<title>Reino Quebrado Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="style3d.css">
</head>
<body>
<div id="labels"><div id="pname" class="pname"></div><div id="mybubble" class="bubble hidden"></div></div>

<div id="hud" class="hidden">
  <div id="status" class="win">
    <div class="wt"><span id="st-name">Lyra</span></div>
    <div class="wb">
      <div id="st-lv">Dançarina · Nv 1</div>
      <div class="bar"><span class="lb">HP</span><div class="track"><div id="hpbar" class="fill hp"></div><em id="hptxt"></em></div></div>
      <div class="bar"><span class="lb">SP</span><div class="track"><div id="spbar" class="fill sp"></div><em id="sptxt"></em></div></div>
      <div class="bar"><span class="lb">XP</span><div class="track thin"><div id="xpbar" class="fill xp"></div><em id="xptxt"></em></div></div>
      <div class="zeny">💰 <b id="zeny">0</b> z</div>
      <div id="buffs"></div>
    </div>
  </div>
  <div id="quest" class="win"></div>
  <div id="menu">
    <button id="btn-stat" title="Atributos (C)">📊</button>
    <button id="btn-skill" title="Habilidades (K)">📜</button>
    <button id="btn-chat" title="Conversar (Enter)">💬</button>
    <button id="btn-sit" title="Sentar (X)">🧘</button>
    <button id="btn-music" title="Música (M)">🎵</button>
    <button id="btn-help" title="Ajuda (H)">❓</button>
  </div>
  <div id="mapbox"><canvas id="minimap" width="180" height="108"></canvas><div id="zonename"></div><div id="online">👤 Solo</div></div>
  <div id="combo"></div>
  <div id="judge"></div>
  <div id="prompt" class="hidden"></div>
  <div id="chat" class="win"></div>
  <div id="bottom">
    <canvas id="beatcv" width="300" height="40"></canvas>
    <div id="hotbar"></div>
  </div>
  <div id="chatbox" class="hidden"><input id="chat-in" maxlength="80" placeholder="Escreva uma mensagem para os amigos…" autocomplete="off"><button id="chat-send">Enviar</button></div>
  <div id="statwin" class="win hidden"></div>
  <div id="skillwin" class="win hidden"></div>
  <div id="dialog" class="win hidden"></div>
  <div id="banner"></div>
  <div id="touch" class="hidden">
    <div id="joy"><div id="knob"></div></div>
    <div id="tbtns">
      <button id="t-talk" class="hidden">💬</button>
      <button id="t-dash">💨</button>
      <button id="t-jump">⤴</button>
      <button id="t-atk">⚔️</button>
    </div>
  </div>
</div>

<div id="rotate"><div class="rbox"><div class="ricon">📱</div><b>Vire o celular de lado</b><span>Crônicas de Solmira foi feito para jogar com o celular deitado.</span></div></div>

<div id="title" class="t3d">
  <div class="tlogo">
    <h1>Reino Quebrado Online</h1>
    <p class="sub">MMORPG de mundo aberto · heróis do livro · universo Kravenox</p>
  </div>
  <div class="create win">
    <div class="wt">Criar personagem</div>
    <div class="cbody">
      <label class="cname">Apelido <input id="name-in" maxlength="16" placeholder="Seu apelido (os NPCs vão te chamar assim)" value="" autocomplete="off"></label>
      <div class="crow"><span class="cl">Herói</span><div id="c-class" class="chips heroes"></div></div>
      <div id="c-info" class="cinfo"></div>
    </div>
    <div class="tbtns">
      <button id="btn-new">✨ Novo Jogo</button>
      <button id="btn-cont">▶ Continuar</button>
    </div>
    <p class="hint"><a href="../2d.html">Jogar a versão 2D original</a> · <span class="ver">versão 11/11 · 16</span></p>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/gltf-loader.js"></script>
<script src="../js/compat.js"></script>
<script src="../js/audio.js"></script>
<script src="classes.js"></script>
<script src="sprites.js"></script>
<script src="spritekit.js"></script>
<script src="modelkit.js"></script>
<script src="avatar.js"></script>
<script src="props.js"></script>
<script src="game3d.js"></script>
<script src="kravenox.js"></script>
<script src="tower.js"></script>
<script src="vida.js"></script>
<script src="evolucao.js"></script>
<script src="quests.js"></script>
<script src="contas.js"></script>
<script src="net.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor)
  navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
// versão nova instalada: recarrega se ainda estiver na tela inicial; no meio do jogo, avisa
const __tinhaSW = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;   // na 1ª visita não recarrega
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange', () => {
  if (window.__recarregou || !__tinhaSW || document.getElementById('name-in') === document.activeElement) return; window.__recarregou = true;
  if (typeof running !== 'undefined' && running) { try { save(); } catch (e) { } log('🔄 Há uma versão nova do jogo. Feche e abra o app para usar.', 'gold'); }
  else location.reload();
});
</script>
</body>
</html>
